services:
  project-hub:
    image: projecthub-api:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: projecthub-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
